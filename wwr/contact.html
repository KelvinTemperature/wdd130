<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is the contact page of white water rafting, specifically Temperature Rafting Company">
    <meta name="author" content="Kelvin Chukwuka">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | Temperature Rafting Company</title>
</head>

<body>
    <header>
        <img src="images/rafting_logo.jpg" alt="Site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h1>Temperature Rafting Company</h1>
            <h3>Labamba Street, off Berger Road, Mpape Abuja</h3>
            <h3>+234(0)8032787322</h3>
            <h3>koolkt10@gmail.com</h3>
        </div>
        <div class="form">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d252162.39439199548!2d7.448166400000001!3d9.060351999999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1795709673411!5m2!1sen!2sng" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <div class="form-item">
                    <label for="name">Name </label>
                    <input type="text" name="name" id="name" required>
                </div>
                <div class="form-item">
                    <label for="email">Email </label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="form-item purpose">
                    <label for="message-purpose">Message Purpose</label>
                    <div>
                        <label for="general"><input type="radio" name="message-purpose" id="general" value="General Inquire"> General Inquire</label><br>
                        <label for="reservation"><input type="radio" name="message-purpose" id="reservation" value="Reservation"> Reservation</label><br>
                        <label for="website"><input type="radio" name="message-purpose" id="website" value="Website Suggestion"> Website Suggestion</label>
                    </div>
                </div>
                <div class="message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="6" placeholder="Type here..."></textarea>
                </div>
                <label for="notify"><input type="checkbox" name="notify" id="notify"> Please Subscribe me to the monthly newsletter</label>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employee-profile">
            <h2>We Are Here to Serve You</h2>
            <div class="figure">
                <figure>
                    <img src="images/corporate2.jpg" alt="rafting image">
                    <figcaption>Gideon John</figcaption>
                </figure>
                <figure>
                    <img src="images/corporate1.jpeg" alt="rafting image">
                    <figcaption>Tessy Orimke</figcaption>
                </figure>
                <figure>
                    <img src="images/corporate3.jpg" alt="rafting image">
                    <figcaption>Solomon Johnson</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 Temperature Rafting Company 👤Kelvin Chukwuka 👤</p>
        <nav class="socialmedia">
            <a href="www.facebook.com"><img src="images/facebook.jpg" alt="facebook"></a>
            <a href="www.linkedin.com"><img src="images/linkedin-square.jpg" alt="linkedin"></a>
            <a href="www.instagram.com"><img src="images/instagram-square.jpg" alt="instagram"></a>
        </nav>
    </footer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Quiz Form</title>
</head>

<body>
    <header>
        <h1>✅ Basic HTML and CSS Quiz</h1>
    </header>
    <Main>
        <form>
            <fieldset>
                <label for="q1"><span>1.</span> What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1">
                <label for="q2"><span>2.</span> How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
                <label for="q3"><span>3.</span> Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="1">//</option>
                    <option value="2">/*.....*/</option>
                    <option value="3">#.....#</option>
                </select>
                <label for="q4"><span>4.</span> What is the bottom margin given below?</label>
                <img src="images/question.png" alt="question">
                <input type="text" name="q4" id="q4">
            </fieldset>
            <button type="submit">Submit Quiz</button>
        </form>
    </Main>
    <footer>
        © 2026 Quiz Form | Kelvin Chukwuka`
    </footer>

</body>

</html>
